<style>

:root{--blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;--red:#E24B4A;--red-light:#FCEBEB;--green:#3B6D11;--green-light:#EAF3DE;--amber:#BA7517;--amber-light:#FAEEDA;--coral:#D85A30;--coral-light:#FAECE7;--border:#e2e8f0;--card:#fff;--text:#1a2332;--muted:#64748b}
.app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:#f0f4f8}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:9999;max-width:320px;text-align:center;animation:fadeIn .2s}
.toast-error{background:#A32D2D}.toast-success{background:#3B6D11}

.login-title{font-size:28px;font-weight:700;color:#fff;margin-bottom:8px;text-align:center}
.login-sub{font-size:15px;color:rgba(255,255,255,0.7);margin-bottom:48px;text-align:center;line-height:1.5}
.login-btn{display:flex;align-items:center;gap:12px;background:#fff;color:#1a2332;padding:14px 28px;border-radius:50px;font-size:16px;font-weight:600;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.25)}
.config-warning{background:rgba(255,80,80,0.2);border:1px solid rgba(255,100,100,0.4);border-radius:12px;padding:16px;color:#fff;font-size:13px;line-height:1.6;margin-top:24px;max-width:340px;text-align:left}

.header h1{font-size:17px;font-weight:600;flex:1}
.header-action{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 10px 4px 4px;cursor:pointer}
.user-avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden}

.user-name{font-size:13px;font-weight:500;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}

.nav-item.active{color:var(--blue)}
.nav-icon{font-size:20px;line-height:1}
.content{padding-bottom:80px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.stat-card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);cursor:pointer}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat-num{font-size:24px;font-weight:700;color:var(--text)}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;margin-top:16px;padding:0 16px}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.badge-buyer{background:var(--blue-light);color:var(--blue)}
.badge-seller{background:var(--coral-light);color:var(--coral)}
.badge-warm{background:#FAEEDA;color:#854F0B}
.badge-hot{background:#FCEBEB;color:#A32D2D}
.badge-cold{background:#f1f5f9;color:var(--muted)}
.badge-new{background:#f1f5f9;color:var(--muted)}
.badge-contacted{background:var(--blue-light);color:var(--blue)}
.badge-offer{background:var(--amber-light);color:var(--amber)}
.badge-closed{background:var(--green-light);color:var(--green)}
.badge-avail{background:var(--green-light);color:var(--green)}
.badge-reserved{background:var(--amber-light);color:var(--amber)}
.badge-sold{background:#f1f5f9;color:var(--muted)}

.av-buyer{background:var(--blue-light);color:var(--blue)}
.av-seller{background:var(--coral-light);color:var(--coral)}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
.contact-row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;transition:background .1s}
.contact-row:active{background:#f8fafc}
.contact-row+.contact-row{border-top:1px solid var(--border)}
.contact-row.selected{background:#EEF5FC}
.contact-info{flex:1;min-width:0}
.contact-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-meta{font-size:13px;color:var(--muted);margin-top:2px}
/* MULTI SELECT */
.multi-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;transition:all .15s}

.select-bar{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1a2332;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;z-index:101}
.select-bar-info{flex:1;font-size:14px;font-weight:600}
.sel-action-btn{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.sel-btn-red{background:#E24B4A;color:#fff}
.sel-btn-gray{background:rgba(255,255,255,0.15);color:#fff}

.fab{position:fixed;bottom:76px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(24,95,165,0.4);z-index:99}

.search-bar{padding:12px 16px;background:#f0f4f8;display:flex;gap:8px;align-items:center}
.search-input{flex:1;background:#fff;border:1px solid var(--border);border-radius:24px;padding:9px 14px;font-size:15px;color:var(--text);outline:none}
.search-input:focus{border-color:var(--blue)}
.chips{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;font-size:13px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
/* FORM */
.form-screen{background:#f0f4f8;min-height:100vh}
.form-body{padding:16px}
.form-group{margin-bottom:14px}
.form-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.form-input{width:100%;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:15px;color:var(--text);outline:none;transition:border .2s}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-opt{padding:11px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;font-size:14px;font-weight:600;color:var(--muted);transition:all .15s;user-select:none}
.type-opt.sel-buyer{background:var(--blue-light);color:var(--blue);border-color:var(--blue)}
.type-opt.sel-seller{background:var(--coral-light);color:var(--coral);border-color:var(--coral)}
.type-opt.sel-avail{background:var(--green-light);color:var(--green);border-color:var(--green)}
.type-opt.sel-reserved{background:var(--amber-light);color:var(--amber);border-color:var(--amber)}
.type-opt.sel-sold{background:#f1f5f9;color:var(--muted);border-color:var(--muted)}
.type-opt.sel-hot{background:#FCEBEB;color:#A32D2D;border-color:#A32D2D}
.type-opt.sel-warm{background:var(--amber-light);color:var(--amber);border-color:var(--amber)}
.type-opt.sel-cold{background:#f1f5f9;color:var(--muted);border-color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn-danger{width:100%;padding:14px;background:var(--red-light);color:var(--red);border:1px solid #F09595;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-secondary{padding:12px 20px;background:#f1f5f9;color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-small{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#f1f5f9;color:var(--text)}
.btn-small-blue{background:var(--blue-light);color:var(--blue);border-color:transparent}
.btn-small-red{background:var(--red-light);color:var(--red);border-color:transparent}
.btn-small-green{background:var(--green-light);color:var(--green);border-color:transparent}
/* DETAIL */
.detail-hero{background:var(--blue);padding:20px 16px 24px;color:#fff}
.detail-hero-top{display:flex;align-items:flex-start;gap:14px}
.hero-avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.detail-name{font-size:22px;font-weight:700;line-height:1.2}
.detail-phone{font-size:15px;opacity:.85;margin-top:4px}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.detail-badges .badge{font-size:12px;padding:4px 10px}
.detail-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.detail-section-card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.detail-section-header{padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-row-label{font-size:14px;color:var(--muted)}
.detail-row-val{font-size:14px;font-weight:600;color:var(--text);text-align:right;max-width:60%}
.detail-notes{padding:12px 14px;font-size:14px;line-height:1.6;color:var(--text)}

.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:14px;line-height:1.5}
/* APPOINTMENTS */
.apt-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px;display:flex;gap:12px}
.apt-date{min-width:44px;text-align:center;background:var(--blue-light);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center}
.apt-day{font-size:20px;font-weight:700;color:var(--blue);line-height:1}
.apt-month{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase}
.apt-info{flex:1;min-width:0}
.apt-contact{font-size:15px;font-weight:600}
.apt-time{font-size:13px;color:var(--muted);margin-top:3px}
/* TEMPLATE */
.template-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px}
.template-name{font-size:15px;font-weight:700;margin-bottom:6px}
.template-text{font-size:13px;color:var(--muted);line-height:1.5;white-space:pre-wrap;margin-bottom:10px}
.template-actions{display:flex;gap:8px;flex-wrap:wrap}
/* SCHEDULED */
.sched-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px}
.sched-name{font-size:15px;font-weight:700;margin-bottom:4px}
.sched-meta{font-size:13px;color:var(--muted);line-height:1.6}
.sched-status{display:flex;align-items:center;gap:6px;margin-top:8px}

.today-banner{background:var(--blue);color:#fff;margin:14px 16px;border-radius:14px;padding:14px 16px}
.today-title{font-size:13px;opacity:.8;margin-bottom:4px}

.pipeline-col{flex:0 0 250px;background:#f8fafc;border-radius:12px;padding:10px}
.pipeline-col-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.pipeline-item{background:#fff;border-radius:10px;border:1px solid var(--border);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pipeline-name{font-size:14px;font-weight:600}
.pipeline-meta{font-size:12px;color:var(--muted);margin-top:2px}
/* MATCH */
.match-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px}
.match-header{display:flex;justify-content:space-between;margin-bottom:10px}
/* PROPERTY */
.prop-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.prop-card.selected{background:#EEF5FC; border-color:var(--blue)}
.prop-title{font-size:16px;font-weight:700;margin-bottom:4px}
.prop-meta{font-size:13px;color:var(--muted)}
.prop-price{font-size:18px;font-weight:700;color:var(--blue);margin-top:6px}
/* SEGMENT */
.segment{display:flex;background:#e8edf2;border-radius:10px;padding:3px;margin:0 16px 14px}
.seg-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:none;color:var(--muted)}
.seg-btn.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end}
.bottom-sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:430px;margin:0 auto}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.status-option{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:15px;font-weight:600}
.status-option:last-child{border-bottom:none}
.info-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:0 0 8px}
.info-row svg{flex-shrink:0}
</style>
</head>

const initials=n=>(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

/* 🛠️ YENİ HAFIZA (AMNAZİ) ÇÖZÜMÜ: Geçmişe ID ve parametreleri de yazıyoruz */
function go(screen,params={}){
  if(S.screen!=='loading')S.history.push({s:S.screen, p:JSON.parse(JSON.stringify(S.params))});
  S.screen=screen;
  S.params=params;
  S.selectMode=false;S.selectedIds=[];S.showBulkSheet=false;
  S.propSelectMode=false;S.selectedPropIds=[];S.showPropBulkSheet=false;
  S.sendTplId=null; S.sendTplSelected=[]; S.waQueueMode=false;
  render();window.scrollTo(0,0);
}
function back(){
  const last = S.history.pop() || {s:'dashboard', p:{}};
  S.screen=last.s;
  S.params=last.p;
  S.selectMode=false;S.selectedIds=[];S.showBulkSheet=false;
  S.propSelectMode=false;S.selectedPropIds=[];S.showPropBulkSheet=false;
  S.sendTplId=null; S.sendTplSelected=[]; S.waQueueMode=false;
  render();window.scrollTo(0,0);
}

function setF(k,v,rerender){
  S.params.form={...(S.params.form||{}),[k]:v};
  if(rerender)render();
}

/* ====== GOOGLE AUTH ====== */
function initGIS(){
  if(typeof google==='undefined'||!google.accounts){setTimeout(initGIS,150);return;}
  if(!CLIENT_ID||CLIENT_ID.includes('BURAYA')){go('login');return;}
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:async(resp)=>{
      if(resp.error){toast('Giriş başarısız: '+resp.error,'error');return;}
      S.token=resp.access_token;
      try{
        showLoading('Bilgiler alınıyor...');
        await fetchUser();
        showLoading("Drive'ınıza bağlanılıyor...");
        await loadOrCreate();
        startChecks();
        go('dashboard');
      }catch(e){toast('Hata: '+e.message,'error');go('login');}
    }
  });
  go('login');
}

function showLoading(msg){
  $('app').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--muted);font-size:15px;background:#f0f4f8"><div style="width:48px;height:48px;border:3px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style><span>${esc(msg)}</span></div>`;
}

async function signIn(){if(!tokenClient){toast('Lütfen bekleyin...');return;}tokenClient.requestAccessToken({prompt:'select_account'});}
async function signOut(){
  if(S.token)try{google.accounts.oauth2.revoke(S.token);}catch(e){}
  S.token=null;S.user=null;S.fileId=null;S.showUserMenu=false;clearInterval(notifTimer);go('login');
}
async function fetchUser(){
  const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{Authorization:'Bearer '+S.token}});
  if(!r.ok)throw new Error('Kullanıcı bilgisi alınamadı');
  S.user=await r.json();
}

/* ====== DRIVE ====== */
async function gFetch(url,opts={}){
  const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+S.token,...(opts.headers||{})}});
  if(r.status===401){toast('Oturum süresi doldu, tekrar giriş yapın.','error');signOut();throw new Error('Auth');}
  if(!r.ok)throw new Error('API '+r.status);
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

async function loadOrCreate(){
  const list=await gFetch(`https://www.googleapis.com/drive/v3/files?q=name='${FILE_NAME}' and trashed=false&fields=files(id)&spaces=drive`);
  if(list.files&&list.files.length>0){
    S.fileId=list.files[0].id;
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${S.fileId}?alt=media`,{headers:{Authorization:'Bearer '+S.token}});
    if(!r.ok)throw new Error('Dosya okunamadı');
    const loaded=await r.json();
    S.data={contacts:loaded.contacts||[],properties:loaded.properties||[],appointments:loaded.appointments||[],templates:loaded.templates||S.data.templates,scheduled:loaded.scheduled||[]};
  }else{
    const meta={name:FILE_NAME,mimeType:'application/json'};
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    form.append('file',new Blob([JSON.stringify(S.data)],{type:'application/json'}));
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+S.token},body:form});
    S.fileId=(await r.json()).id;
  }
}

function scheduleSave(){
  clearTimeout(saveTimer);S.saving=true;
  const bar=$('savingBar');if(bar)bar.style.display='block';
  saveTimer=setTimeout(async()=>{
    if(!S.fileId||!S.token)return;
    try{await fetch(`https://www.googleapis.com/upload/drive/v3/files/${S.fileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:JSON.stringify(S.data)});}
    catch(e){toast('Kayıt hatası','error');}
    finally{S.saving=false;const b=$('savingBar');if(b)b.style.display='none';}
  },1800);
}

/* ====== NOTIFICATIONS ====== */
function startChecks(){
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();
  checkAll();notifTimer=setInterval(checkAll,60000);
}
function checkAll(){
  const now=new Date();const ts=today();
  S.data.scheduled.forEach(m=>{
    if(m.sent)return;
    if(new Date(m.scheduledAt)<=now){notify('Mesaj Zamanı!',`"${m.name}" mesajını gönderme zamanı!`);m.sent=true;scheduleSave();}
  });
  S.data.appointments.forEach(a=>{
    if(a.done||a.date!==ts)return;
    const[h,mn]=(a.time||'09:00').split(':').map(Number);
    const due=new Date();due.setHours(h,mn-15,0,0);
    const diff=due-now;
    if(diff>0&&diff<60000){const c=S.data.contacts.find(x=>x.id===a.contactId);notify('Randevu Hatırlatması',`15 dk sonra: ${c?c.name:'Randevu'} - ${a.time}`);}
  });
}
function notify(title,body){if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body});}

/* ====== MULTI SELECT - KİŞİLER ====== */
function toggleSelectMode(){S.selectMode=!S.selectMode;S.selectedIds=[];render();}
function toggleSelect(id){
  S.selectedIds=S.selectedIds.includes(id)?S.selectedIds.filter(x=>x!==id):[...S.selectedIds,id];
  render();
}
function selectAllVisible(){
  const ids=getFiltered().map(c=>c.id);
  S.selectedIds=ids.every(id=>S.selectedIds.includes(id))?[]:ids;
  render();
}
function bulkDelete(){
  if(!S.selectedIds.length)return;
  if(!confirm(`${S.selectedIds.length} kişi kalıcı olarak silinecek. Emin misiniz?`))return;

  let propsToDelete = 0;
  S.selectedIds.forEach(id => { propsToDelete += S.data.properties.filter(p => p.ownerId === id).length; });

  if(propsToDelete > 0) {
    if(confirm(`Seçilen kişilere ait toplam ${propsToDelete} adet mülk bulundu. Mülkleri de silelim mi?\n\n(Tamam = Mülkleri de sil, İptal = Mülkleri sahipsiz bırakarak sakla)`)) {
      S.data.properties = S.data.properties.filter(p => !S.selectedIds.includes(p.ownerId));
    } else {
      S.data.properties.forEach(p => { if(S.selectedIds.includes(p.ownerId)) p.ownerId = ''; });
    }
  }

  S.data.contacts=S.data.contacts.filter(x=>!S.selectedIds.includes(x.id));
  S.selectedIds=[];S.selectMode=false;scheduleSave();toast('Silindi','success');render();
}
function bulkSetStatus(status){
  S.selectedIds.forEach(id=>{const c=S.data.contacts.find(x=>x.id===id);if(c)c.status=status;});
  S.showBulkSheet=false;S.selectedIds=[];S.selectMode=false;scheduleSave();toast('Durum güncellendi','success');render();
}
function bulkSetHeat(heat){
  S.selectedIds.forEach(id=>{const c=S.data.contacts.find(x=>x.id===id);if(c)c.heat=heat;});
  S.showBulkSheet=false;S.selectedIds=[];S.selectMode=false;scheduleSave();toast('Sıcaklık güncellendi','success');render();
}

/* ====== MULTI SELECT - MÜLKLER ====== */
function togglePropSelectMode(){S.propSelectMode=!S.propSelectMode;S.selectedPropIds=[];render();}
function togglePropSelect(id){
  S.selectedPropIds=S.selectedPropIds.includes(id)?S.selectedPropIds.filter(x=>x!==id):[...S.selectedPropIds,id];
  render();
}
function selectAllPropsVisible(){
  let props = S.data.properties || [];
  if(S.filter.propObj === 'portfolio') props = props.filter(p => p.isPortfolio);
  const ids=props.map(p=>p.id);
  S.selectedPropIds=ids.every(id=>S.selectedPropIds.includes(id))?[]:ids;
  render();
}
function propBulkDelete(){
  if(!S.selectedPropIds.length)return;
  if(!confirm(`${S.selectedPropIds.length} mülk kalıcı olarak silinecek. Emin misiniz?`))return;
  
  S.data.contacts.forEach(c => { if(S.selectedPropIds.includes(c.interestedIn)) c.interestedIn = ''; });
  S.data.properties=S.data.properties.filter(x=>!S.selectedPropIds.includes(x.id));
  
  S.selectedPropIds=[];S.propSelectMode=false;scheduleSave();toast('Mülkler silindi','success');render();
}
function propBulkSetStatus(status){
  S.selectedPropIds.forEach(id=>{const p=S.data.properties.find(x=>x.id===id);if(p)p.status=status;});
  S.showPropBulkSheet=false;S.selectedPropIds=[];S.propSelectMode=false;scheduleSave();toast('Durum güncellendi','success');render();
}

/* ====== RENDER ====== */
function render(){
  const screens={
    login: buildLogin,
    dashboard: buildDashboard,
    contacts: buildContacts,
    'contact-detail': buildContactDetail,
    'contact-form': buildContactForm,
    properties: buildProperties,
    'property-detail': buildPropertyDetail,
    'property-form': buildPropertyForm,
    messages: buildMessages,
    'template-form': buildTemplateForm,
    'schedule-form': buildScheduleForm,
    appointments: buildAppointments,
    'appointment-form': buildAptForm,
    matching: buildMatching,
    pipeline: buildPipeline
  };

  let content = '';
  if(S.screen === 'loading') {
    content = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted)">Yükleniyor...</div>`;
  } else {
    content = (screens[S.screen] || screens.dashboard)();
  }

  $('app').innerHTML=`<div class="app">
    <div id="savingBar" class="saving-bar" style="display:${S.saving?'block':'none'}"></div>
    ${S.toast?`<div class="toast toast-${S.toast.type}">${esc(S.toast.msg)}</div>`:''}
    ${content}
    ${S.screen!=='login'&&S.screen!=='loading'?buildNav():''}
    ${S.showUserMenu?buildUserMenu():''}
    ${S.showBulkSheet?buildBulkSheet():''}
    ${S.showPropBulkSheet?buildPropBulkSheet():''}
    ${S.selectMode&&S.selectedIds.length>0?buildSelectBar():''}
    ${S.propSelectMode&&S.selectedPropIds.length>0?buildPropSelectBar():''}
  </div>`;
}

function buildNav(){
  const tabs=[{id:'dashboard',icon:'🏠',label:'Ana Sayfa'},{id:'contacts',icon:'👥',label:'Kişiler'},{id:'properties',icon:'🏘️',label:'Mülkler'},{id:'messages',icon:'💬',label:'Mesajlar'},{id:'appointments',icon:'📅',label:'Takvim'}];
  const inContact=['contact-form','contact-detail'];
  const inProp=['property-form','property-detail'];
  return `<nav class="bottom-nav">${tabs.map(t=>`<button class="nav-item ${S.screen===t.id||(inContact.includes(S.screen)&&t.id==='contacts')||(inProp.includes(S.screen)&&t.id==='properties')?'active':''}" onclick="go('${t.id}')"><span class="nav-icon">${t.icon}</span><span>${t.label}</span></button>`).join('')}</nav>`;

/* ====== CONTACTS ====== */
function getFiltered(){
  let cs=S.data.contacts;
  if(S.filter.type!=='all')cs=cs.filter(x=>x.type===S.filter.type);
  if(S.filter.status!=='all')cs=cs.filter(x=>(x.status||'new')===S.filter.status);
  if(S.search.trim()){const q=S.search.toLowerCase();cs=cs.filter(x=>x.name.toLowerCase().includes(q)||(x.phone||'').includes(q)||(x.district||'').toLowerCase().includes(q));}
  return cs;
}

function buildContacts(){
  const cs=getFiltered();
  const buyers=S.data.contacts.filter(x=>x.type==='buyer').length;
  const sellers=S.data.contacts.filter(x=>x.type==='seller').length;
  const allIds=cs.map(c=>c.id);
  const allSelected=allIds.length>0&&allIds.every(id=>S.selectedIds.includes(id));

  const headerRight=S.selectMode
    ?`<button class="header-action" onclick="selectAllVisible()" title="${allSelected?'Seçimi kaldır':'Tümünü seç'}">${allSelected?'☑':'☐'}</button><button class="header-action" style="font-size:14px" onclick="toggleSelectMode()">İptal</button>`
    :`<button class="header-action" title="Seçim modu" onclick="toggleSelectMode()">☐</button><button class="header-action" onclick="go('pipeline')">⬜</button>`;

  return `<div class="content">${buildHeader('Kişiler',false,headerRight)}
    <div class="search-bar"><input class="search-input" type="search" placeholder="İsim, telefon, semt..." value="${esc(S.search)}" oninput="S.search=this.value;render()"></div>
    <div class="chips">
      <div class="chip ${S.filter.type==='all'?'on':''}" onclick="S.filter.type='all';render()">Tümü (${S.data.contacts.length})</div>

      <div class="chip ${S.filter.type==='seller'?'on':''}" onclick="S.filter.type='seller';render()">Satıcılar (${sellers})</div>
      ${['new','contacted','offer','closed'].map(s=>`<div class="chip ${S.filter.status===s?'on':''}" onclick="S.filter.status='${s}';render()">${STATUS_LABELS[s]}</div>`).join('')}
      <div class="chip ${S.filter.status==='all'?'on':''}" onclick="S.filter.status='all';render()">Tüm Durumlar</div>
    </div>
    ${S.selectMode?`<div style="padding:0 16px 8px;font-size:13px;color:var(--muted)">Kişilere dokunarak seçin · ${S.selectedIds.length} seçili</div>`:''}
    <div style="padding:0 16px">
      ${cs.length===0?`<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">Kayıt bulunamadı</div><div class="empty-sub">+ butonuyla ilk müşteriyi ekleyin</div></div>`
      :`<div class="card">${cs.map(c=>{
        const isSel=S.selectedIds.includes(c.id);
        return `<div class="contact-row${isSel?' selected':''}" onclick="${S.selectMode?`toggleSelect('${c.id}')`:`go('contact-detail',{id:'${c.id}'})`}">
          ${S.selectMode?`<div class="multi-checkbox${isSel?' checked':''}">${isSel?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':''}</div>`:''}
          <div class="avatar ${c.type==='buyer'?'av-buyer':'av-seller'}">${initials(c.name)}</div>
          <div class="contact-info"><div class="contact-name">${esc(c.name)}</div><div class="contact-meta">${esc(c.phone||'-')} · ${esc(c.district||'')}</div></div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <span class="badge badge-${c.type}">${c.type==='buyer'?'Alıcı':'Satıcı'}</span>
            <span class="badge badge-${c.heat||'warm'}">${{hot:'🔴',warm:'🟡',cold:'🔵'}[c.heat||'warm']}</span>
          </div>
        </div>`;}).join('')}</div>`}
    </div>
    ${!S.selectMode?`<button class="fab" onclick="go('contact-form',{form:{type:'buyer'}})">+</button>`:''}
  </div>`;
}

function updateStatus(id,s){const c=S.data.contacts.find(x=>x.id===id);if(c){c.status=s;scheduleSave();render();}}
function updateHeat(id,h){const c=S.data.contacts.find(x=>x.id===id);if(c){c.heat=h;scheduleSave();render();}}

function delContact(id){
  if(!confirm('Bu kişiyi kalıcı olarak silmek istiyor musunuz?'))return;
  const props = S.data.properties.filter(p => p.ownerId === id);
  if(props.length > 0) {
    if(confirm(`Bu kişiye ait ${props.length} adet mülk bulundu. Mülkleri de sistemden silelim mi?`)) {
      S.data.properties = S.data.properties.filter(p => p.ownerId !== id);
    } else {
      S.data.properties.forEach(p => { if(p.ownerId === id) p.ownerId = ''; });
    }
  }
  S.data.contacts=S.data.contacts.filter(x=>x.id!==id);scheduleSave();toast('Silindi','success');back();
}

function waOpen(num,msg){window.open(`https://wa.me/90${num}${msg?'?text='+encodeURIComponent(msg):''}`, '_blank');}

        <div class="form-group"><label class="form-label">Komisyon (₺)</label><input class="form-input" type="text" placeholder="75000" value="${esc(f.commission||'')}" oninput="setF('commission',this.value)"></div>
      </div>
      <div class="form-group"><label class="form-label">Müşteri Sıcaklığı</label>
        <div class="type-grid" style="grid-template-columns:1fr 1fr 1fr">
          <div class="type-opt ${heat==='hot'?'sel-hot':''}" onclick="setF('heat','hot',true)">🔴 Sıcak</div>
          <div class="type-opt ${heat==='warm'?'sel-warm':''}" onclick="setF('heat','warm',true)">🟡 Ilık</div>
          <div class="type-opt ${heat==='cold'?'sel-cold':''}" onclick="setF('heat','cold',true)">🔵 Soğuk</div>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Notlar</label><textarea class="form-input" rows="3" placeholder="Özel istekler, notlar..." oninput="setF('notes',this.value)">${esc(f.notes||'')}</textarea></div>
      <button class="btn-primary" onclick="saveContact()">${isEdit?'✅ Güncelle':'💾 Kaydet'}</button>
      ${isEdit?`<button class="btn-danger" onclick="delContactFromForm('${S.params.editId}')">🗑️ Bu Kişiyi Sil</button>`:''}

  </div>`;
}

function delContactFromForm(id){
  if(!confirm('Bu kişiyi kalıcı olarak silmek istiyor musunuz?'))return;
  const props = S.data.properties.filter(p => p.ownerId === id);
  if(props.length > 0) {
    if(confirm(`Bu kişiye ait ${props.length} adet mülk bulundu. Mülkleri de sistemden silelim mi?`)) {
      S.data.properties = S.data.properties.filter(p => p.ownerId !== id);
    } else {
      S.data.properties.forEach(p => { if(p.ownerId === id) p.ownerId = ''; });
    }
  }
  S.data.contacts=S.data.contacts.filter(x=>x.id!==id);
  scheduleSave();toast('Silindi','success');
  S.history.pop();
  back();
}

function saveContact(){
  const f=S.params.form||{};
  if(!f.name?.trim()){toast('Ad soyad zorunludur','error');return;}
  if(!f.phone?.trim()){toast('Telefon zorunludur','error');return;}
  if(S.params.editId){
    const idx=S.data.contacts.findIndex(c=>c.id===S.params.editId);
    if(idx>=0)S.data.contacts[idx]={...S.data.contacts[idx],...f,id:S.params.editId};
    toast('Güncellendi ✅','success');
  }else{
    S.data.contacts.unshift({...f,id:uid(),status:'new',heat:f.heat||'warm',createdAt:new Date().toLocaleDateString('tr-TR')});
    toast('Kaydedildi ✅','success');
  }
  scheduleSave();S.params={};back();
}

/* ====== YENİ: PROPERTIES VE FİLTRELEME ====== */

  const allSelected=allIds.length>0&&allIds.every(id=>S.selectedPropIds.includes(id));

    <div style="padding:0 16px 14px">
      ${props.length===0?`<div class="empty"><div class="empty-icon">🏘️</div><div class="empty-title">Mülk bulunamadı</div></div>`
      :props.map(p=>{
        const owner=S.data.contacts.find(x=>x.id===p.ownerId);
        const isSel=S.selectedPropIds.includes(p.id);
        const secretBadge = p.isSecret ? `<span style="color:#8b5cf6;font-weight:700">🤫 Gizli (El Altı) Portföy</span><br>` : '';
        const portBadge = p.isPortfolio ? `<span style="color:var(--amber);font-weight:700">🌟 Yetkili Portföy</span><br>` : '';

        return `<div class="prop-card${isSel?' selected':''}" onclick="${S.propSelectMode?`togglePropSelect('${p.id}')`:`go('property-detail',{id:'${p.id}'})`}" style="${!isSel&&p.status==='sold'?'background:#f8fafc; border-color:#cbd5e1':''}">

            <div style="display:flex;align-items:flex-start;gap:10px">
              ${S.propSelectMode?`<div class="multi-checkbox${isSel?' checked':''}">${isSel?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':''}</div>`:''}
              <div class="prop-title" style="${p.status==='sold'?'text-decoration:line-through;color:var(--muted)':''}">${esc(p.title||p.propType||'Mülk')}</div>
            </div>
            <span class="badge badge-${p.status||'avail'}">${{avail:'Satışta',reserved:'Rezerve',sold:'Satıldı'}[p.status||'avail']}</span>
          </div>

/* ====== YENİ: FOTOĞRAF SIKIŞTIRMA VE YÜKLEME ====== */
function compressImg(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const MAX = 1200; 
        if(width > height && width > MAX) { height *= MAX / width; width = MAX; }
        else if(height > MAX) { width *= MAX / height; height = MAX; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.65);
      }
    }
  });
}

async function handleImageSelect(e, propId) {
  const files = e.target.files;
  if(!files || files.length===0) return;
  
  $('app').insertAdjacentHTML('beforeend', `<div id="imgLoad" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-direction:column;gap:10px"><div style="width:40px;height:40px;border:4px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div>Fotoğraflar Sıkıştırılıp Yükleniyor...</div>`);

  const p = S.data.properties.find(x=>x.id === propId);
  if(!p.images) p.images = [];

  for(let i=0; i<files.length; i++) {
    try {
      const compressedBlob = await compressImg(files[i]);
      const meta = { name: 'crm_ev_' + Date.now() + '.jpg', mimeType: 'image/jpeg' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], {type: 'application/json'}));
      form.append('file', compressedBlob);

      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + S.token },
        body: form
      });
      const res = await r.json();
      p.images.push(res.id);
    } catch(err) { console.error("Resim yükleme hatası", err); }
  }
  
  const loader = $('imgLoad'); if(loader) loader.remove();
  scheduleSave();
  render();
  setTimeout(()=>loadAllImagesForProp(propId), 100);
}

async function loadAllImagesForProp(propId) {
  const p = S.data.properties.find(x=>x.id === propId);
  if(!p || !p.images) return;
  let changed = false;
  for(let id of p.images) {
    if(!S.imgCache[id]) {
      try {
        const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: 'Bearer ' + S.token } });
        const blob = await r.blob();
        S.imgCache[id] = URL.createObjectURL(blob);
        changed = true;
      } catch(err){}
    }
  }
  if(changed && S.screen === 'property-detail' && S.params.id === propId) render();
}

function delImage(propId, imgId) {
  if(!confirm('Bu fotoğrafı silmek istediğinize emin misiniz?')) return;
  const p = S.data.properties.find(x=>x.id === propId);
  p.images = p.images.filter(x => x !== imgId);
  scheduleSave();
  render();
  fetch(`https://www.googleapis.com/drive/v3/files/${imgId}`, {method:'DELETE', headers:{Authorization:'Bearer '+S.token}}).catch(e=>{});
}

async function shareImagesWA(propId) {
  const p = S.data.properties.find(x=>x.id === propId);
  if(!p || !p.images || !p.images.length) return;
  
  $('app').insertAdjacentHTML('beforeend', `<div id="imgLoad" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-direction:column;gap:10px"><div style="width:40px;height:40px;border:4px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div>Paylaşım Hazırlanıyor...</div>`);
  
  try {
    const filesArray = [];
    for(let i=0; i<p.images.length; i++) {
        const id = p.images[i];
        const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: 'Bearer ' + S.token } });
        const blob = await r.blob();
        filesArray.push(new File([blob], `emlak_foto_${i+1}.jpg`, {type: 'image/jpeg'}));
    }
    const loader = $('imgLoad'); if(loader) loader.remove();

    if (navigator.canShare && navigator.canShare({ files: filesArray })) {
        await navigator.share({
          files: filesArray,
          title: p.title || 'Mülk Fotoğrafları',
          text: `🏠 ${p.title || 'Mülk'} detayları ve fotoğrafları ektedir.`
        });
    } else {
        toast('Cihazınız Akıllı Paylaşımı desteklemiyor.', 'error');
    }
  } catch(e) {
    const loader = $('imgLoad'); if(loader) loader.remove();
  }
}

function saveProperty(){
  const f=S.params.form||{};
  if(!f.propType&&!f.title){toast('Mülk türü veya başlık giriniz','error');return;}
  if(S.params.editId){
    const idx=S.data.properties.findIndex(p=>p.id===S.params.editId);
    if(idx>=0)S.data.properties[idx]={...S.data.properties[idx],...f,id:S.params.editId};
    toast('Güncellendi ✅','success');
  }else{
    S.data.properties.unshift({...f,id:uid(),createdAt:new Date().toLocaleDateString('tr-TR')});
    toast('Mülk eklendi ✅','success');
  }
  scheduleSave();S.params={};back();
}

function delPropertyFromForm(id){
  if(!confirm('Bu mülkü kalıcı olarak silmek istiyor musunuz?'))return;
  S.data.contacts.forEach(c => { if(c.interestedIn === id) c.interestedIn = ''; });
  S.data.properties=S.data.properties.filter(x=>x.id!==id);
  scheduleSave();toast('Silindi','success');
  S.history.pop();
  back();
}

  // SEÇİM MODUNDAYSAK
  const allSel = contacts.length > 0 && S.sendTplSelected.length === contacts.length;
  return `<div class="content">${buildHeader('Kime Gönderilecek?', true, `<button class="header-action" onclick="S.sendTplId=null;render()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>`)}
    <div style="padding:16px">
       <div style="background:var(--blue-light);color:var(--blue);padding:12px;border-radius:10px;margin-bottom:14px;font-size:14px"><b>Şablon:</b> ${esc(tpl.name)}</div>
       <div style="max-height:60vh;overflow-y:auto;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:14px">
         <label style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:2px solid var(--border);cursor:pointer;font-weight:700;background:#f8fafc">
            <input type="checkbox" onchange="S.sendTplSelected = this.checked ? S.data.contacts.filter(c=>c.phone).map(c=>c.id) : []; render();" style="width:20px;height:20px;accent-color:var(--blue)" ${allSel?'checked':''}> TÜMÜNÜ SEÇ
         </label>
         ${contacts.length===0?`<div style="padding:16px;text-align:center;color:var(--muted)">Telefon numarası kayıtlı kimse yok.</div>`:''}
         ${contacts.map(c=>`<label style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer">
            <input type="checkbox" ${S.sendTplSelected.includes(c.id)?'checked':''} onchange="S.sendTplSelected=this.checked?[...S.sendTplSelected,'${c.id}']:S.sendTplSelected.filter(x=>x!=='${c.id}');render()" style="width:18px;height:18px;accent-color:var(--blue)">
            <div style="flex:1"><div style="font-size:15px;font-weight:600">${esc(c.name)}</div><div style="font-size:12px;color:var(--muted)">${esc(c.phone)} · ${esc(c.district||'')}</div></div>
         </label>`).join('')}
       </div>
       <button class="btn-primary" style="background:#25D366;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px" onclick="if(S.sendTplSelected.length===0){toast('Kimseyi seçmediniz!', 'error');return;} S.waQueueMode=true; render();">${WA_SVG} Devam Et (${S.sendTplSelected.length})</button>
    </div>
  </div>`;
}

function buildScheduled(){
  const pending=S.data.scheduled.filter(x=>!x.sent);
  const sent=S.data.scheduled.filter(x=>x.sent).slice(0,3);
  return `<div style="padding:0 16px">
    <button class="btn-primary" style="margin-bottom:14px" onclick="go('schedule-form',{form:{repeatType:'none'},editId:null})">+ Mesaj Zamanla</button>
    ${pending.length===0&&sent.length===0?`<div class="empty"><div class="empty-icon">⏰</div><div class="empty-title">Zamanlanmış mesaj yok</div></div>`:''}
    ${pending.map(m=>{const tpl=S.data.templates.find(t=>t.id===m.templateId);const rc=m.recipientIds==='all'?S.data.contacts.length:(m.recipientIds||[]).length;return `<div class="sched-card"><div class="sched-name">${esc(m.name)}</div><div class="sched-meta">📅 ${esc(fmtDate(m.scheduledAt?.slice(0,10)))} ⏰ ${esc(m.scheduledAt?.slice(11,16)||'')}${m.repeatType&&m.repeatType!=='none'?` · 🔄 ${m.repeatType==='weekly'?'Haftalık':'Aylık'}`:''}</div><div class="sched-meta">👥 ${rc} kişi · 📋 ${esc(tpl?.name||'-')}</div><div class="sched-status"><span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block"></span><span style="font-size:12px;color:var(--green)">Bekliyor</span><button class="btn-small btn-small-red" style="margin-left:auto" onclick="delSched('${m.id}')">İptal</button></div></div>`;}).join('')}
    ${sent.map(m=>`<div class="sched-card" style="opacity:.5"><div class="sched-name">${esc(m.name)}</div><div class="sched-meta">✅ Gönderildi · ${esc(fmtDate(m.scheduledAt?.slice(0,10)))}</div></div>`).join('')}
  </div>`;
}

function delTpl(id){if(!confirm('Şablonu sil?'))return;S.data.templates=S.data.templates.filter(x=>x.id!==id);scheduleSave();render();}
function delSched(id){if(!confirm('İptal et?'))return;S.data.scheduled=S.data.scheduled.filter(x=>x.id!==id);scheduleSave();render();}

function buildTemplateForm(){
  const f=S.params.form||{};const isEdit=!!S.params.editId;
  return `<div class="form-screen">${buildHeader(isEdit?'Şablonu Düzenle':'Yeni Şablon',true)}
    <div class="form-body">
      <div class="form-group"><label class="form-label">Şablon Adı *</label><input class="form-input" type="text" placeholder="Randevu Hatırlatma" value="${esc(f.name||'')}" oninput="setF('name',this.value)"></div>
      <div class="form-group"><label class="form-label">Mesaj Metni *</label><textarea class="form-input" rows="6" placeholder="{isim}, {telefon}, {semt}, {saat} değişkenlerini kullanabilirsiniz" oninput="setF('text',this.value)">${esc(f.text||'')}</textarea></div>
      <button class="btn-primary" onclick="saveTpl()">${isEdit?'✅ Güncelle':'💾 Kaydet'}</button>
    </div>
  </div>`;
}
function saveTpl(){
  const f=S.params.form||{};if(!f.name?.trim()||!f.text?.trim()){toast('Ad ve metin zorunludur','error');return;}
  if(S.params.editId)S.data.templates=S.data.templates.map(t=>t.id===S.params.editId?{...f,id:S.params.editId}:t);
  else S.data.templates.push({...f,id:uid()});
  scheduleSave();toast('Kaydedildi','success');S.params={tab:'templates'};back();
}

function buildScheduleForm(){
  const f=S.params.form||{repeatType:'none'};
  const contacts=S.data.contacts.filter(x=>x.phone);
  const selAll=f.recipientIds==='all'||f.recipientIds===undefined;
  return `<div class="form-screen">${buildHeader('Mesaj Zamanla',true)}
    <div class="form-body">
      <div class="form-group"><label class="form-label">Mesaj Adı *</label><input class="form-input" type="text" placeholder="Haftalık Hatırlatma" value="${esc(f.name||'')}" oninput="setF('name',this.value)"></div>
      <div class="form-group"><label class="form-label">Şablon Seç</label><select class="form-input" onchange="setF('templateId',this.value)"><option value="">Seçiniz</option>${S.data.templates.map(t=>`<option value="${t.id}" ${f.templateId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
      <div class="row2">
        <div class="form-group"><label class="form-label">Tarih *</label><input class="form-input" type="date" value="${f.scheduledDate||''}" oninput="setF('scheduledDate',this.value)"></div>
        <div class="form-group"><label class="form-label">Saat *</label><input class="form-input" type="time" value="${f.scheduledTime||'09:00'}" oninput="setF('scheduledTime',this.value)"></div>
      </div>
      <div class="form-group"><label class="form-label">Tekrar</label><select class="form-input" onchange="setF('repeatType',this.value)"><option value="none">Tekrar Yok</option><option value="weekly" ${f.repeatType==='weekly'?'selected':''}>Her Hafta</option><option value="monthly" ${f.repeatType==='monthly'?'selected':''}>Her Ay</option></select></div>
      <div class="form-group"><label class="form-label">Alıcılar</label>
        <div class="type-grid" style="margin-bottom:10px">
          <div class="type-opt ${selAll?'sel-buyer':''}" onclick="setF('recipientIds','all',true)">👥 Herkese</div>
          <div class="type-opt ${!selAll?'sel-seller':''}" onclick="setF('recipientIds',[],true)">✅ Seçtiklerime</div>
        </div>
        ${!selAll?`<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:10px">${contacts.map(c=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox" ${(Array.isArray(f.recipientIds)&&f.recipientIds.includes(c.id))?'checked':''} onchange="let r=S.params.form.recipientIds||[]; setF('recipientIds',this.checked?[...r,'${c.id}']:r.filter(x=>x!=='${c.id}'))"><span style="font-size:14px">${esc(c.name)}</span></label>`).join('')}</div>`:''}
      </div>
      <button class="btn-primary" onclick="saveSched()">⏰ Zamanla</button>
    </div>
  </div>`;
}
function saveSched(){
  const f=S.params.form||{};
  if(!f.name?.trim()){toast('Mesaj adı zorunludur','error');return;}
  if(!f.scheduledDate||!f.scheduledTime){toast('Tarih ve saat seçiniz','error');return;}
  S.data.scheduled.push({id:uid(),name:f.name,templateId:f.templateId,scheduledAt:`${f.scheduledDate}T${f.scheduledTime}:00`,repeatType:f.repeatType||'none',recipientIds:f.recipientIds||'all',sent:false});
  scheduleSave();toast('Zamanlandı ✅','success');S.params={tab:'scheduled'};back();
}

/* ====== APPOINTMENTS ====== */
function buildAppointments(){
  const apts=[...S.data.appointments].sort((a,b)=>a.date.localeCompare(b.date));
  const pending=apts.filter(x=>!x.done);
  const done=apts.filter(x=>x.done).slice(0,5);
  return `<div class="content">${buildHeader('Randevular')}
    <div style="padding:14px 16px 0">
      ${pending.length===0?`<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">Randevu yok</div><div class="empty-sub">+ ile randevu ekleyin</div></div>`
      :pending.map(a=>{
        const c=S.data.contacts.find(x=>x.id===a.contactId);
        const p=S.data.properties.find(x=>x.id===a.propertyId);
        const d=new Date(a.date+'T12:00:00');const isToday=a.date===today();
        return `<div class="apt-card" style="${isToday?'border-color:var(--blue);border-width:2px':''}">
          <div class="apt-date" style="${isToday?'background:var(--blue)':''}"><span class="apt-day" style="${isToday?'color:#fff':''}">${d.getDate()}</span><span class="apt-month" style="${isToday?'color:#fff':''}">${MONTHS_TR[d.getMonth()]}</span></div>
          <div class="apt-info"><div class="apt-contact">${esc(c?c.name:'Bilinmiyor')}${isToday?' 🔔':''}</div><div class="apt-time">⏰ ${esc(a.time||'')}${p?' · 🏠 '+esc(p.title||p.propType||''):''}</div>${a.notes?`<div class="apt-time">${esc(a.notes.slice(0,50))}</div>`:''}
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
              <button class="btn-small btn-small-green" onclick="markDone('${a.id}')">✅ Tamamlandı</button>
              ${c?.phone?`<button class="btn-small btn-small-green" style="display:flex;align-items:center;gap:4px;background:#EAF3DE;color:#3B6D11;border:none" onclick="waOpen('${fmtPhone(c.phone)}','')">${WA_SVG} WA</button>`:''}
              <button class="btn-small btn-small-red" onclick="delApt('${a.id}')">Sil</button>
            </div>
          </div>
        </div>`;}).join('')}
      ${done.length>0?`<div style="font-size:13px;font-weight:600;color:var(--muted);padding:12px 0 8px;opacity:.7">Tamamlananlar</div>${done.map(a=>{const c=S.data.contacts.find(x=>x.id===a.contactId);const d=new Date(a.date+'T12:00:00');return `<div class="apt-card" style="opacity:.5"><div class="apt-date"><span class="apt-day">${d.getDate()}</span><span class="apt-month">${MONTHS_TR[d.getMonth()]}</span></div><div class="apt-info"><div class="apt-contact">${esc(c?c.name:'')}</div><div class="apt-time">⏰ ${esc(a.time||'')}</div></div></div>`;}).join('')}`:''}
    </div>
    <button class="fab" onclick="go('appointment-form',{form:{date:'${today()}',time:'10:00'},editId:null})">+</button>
  </div>`;
}

function markDone(id){const a=S.data.appointments.find(x=>x.id===id);if(a){a.done=true;scheduleSave();render();}}
function delApt(id){if(!confirm('Randevuyu sil?'))return;S.data.appointments=S.data.appointments.filter(x=>x.id!==id);scheduleSave();render();}

function buildAptForm(){
  const f=S.params.form||{date:today(),time:'10:00'};const isEdit=!!S.params.editId;
  return `<div class="form-screen">${buildHeader(isEdit?'Randevuyu Düzenle':'Yeni Randevu',true)}
    <div class="form-body">
      <div class="form-group"><label class="form-label">Müşteri *</label><select class="form-input" onchange="setF('contactId',this.value)"><option value="">Seçiniz</option>${S.data.contacts.map(c=>`<option value="${c.id}" ${f.contactId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Mülk (İsteğe bağlı)</label><select class="form-input" onchange="setF('propertyId',this.value)"><option value="">Seçiniz</option>${S.data.properties.map(p=>`<option value="${p.id}" ${f.propertyId===p.id?'selected':''}>${esc(p.title||p.propType||'Mülk')} - ${esc(p.district||'')}</option>`).join('')}</select></div>
      <div class="row2">
        <div class="form-group"><label class="form-label">Tarih *</label><input class="form-input" type="date" value="${esc(f.date||today())}" oninput="setF('date',this.value)"></div>
        <div class="form-group"><label class="form-label">Saat *</label><input class="form-input" type="time" value="${esc(f.time||'10:00')}" oninput="setF('time',this.value)"></div>
      </div>
      <div class="form-group"><label class="form-label">Notlar</label><textarea class="form-input" rows="3" placeholder="Randevu notları..." oninput="setF('notes',this.value)">${esc(f.notes||'')}</textarea></div>
      <button class="btn-primary" onclick="saveApt()">${isEdit?'✅ Güncelle':'💾 Kaydet'}</button>
    </div>
  </div>`;
}
function saveApt(){
  const f=S.params.form||{};
  if(!f.contactId){toast('Müşteri seçiniz','error');return;}
  if(!f.date){toast('Tarih seçiniz','error');return;}
  if(S.params.editId)S.data.appointments=S.data.appointments.map(a=>a.id===S.params.editId?{...f,id:S.params.editId}:a);
  else S.data.appointments.push({...f,id:uid(),done:false});
  scheduleSave();toast('Randevu kaydedildi ✅','success');S.params={};back();
}

/* ====== PIPELINE ====== */
function buildPipeline(){
  const stages=['new','contacted','offer','closed'];
  return `<div class="content">${buildHeader('Pipeline',true)}
    <div style="display:flex;overflow-x:auto;gap:10px;padding:14px 16px 20px">
      ${stages.map(s=>{const items=S.data.contacts.filter(x=>(x.status||'new')===s);return `<div class="pipeline-col"><div class="pipeline-col-title">${STATUS_LABELS[s]} <span style="font-weight:400;font-size:11px">(${items.length})</span></div>${items.length===0?`<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px">Boş</div>`:items.map(c=>`<div class="pipeline-item" onclick="go('contact-detail',{id:'${c.id}'})"><div class="pipeline-name">${esc(c.name)}</div><div class="pipeline-meta">${numFmt(c.budget)||'-'} · ${esc(c.district||'-')}</div><div style="margin-top:6px"><span class="badge badge-${c.type}">${c.type==='buyer'?'Alıcı':'Satıcı'}</span></div></div>`).join('')}</div>`;}).join('')}
    </div>
  </div>`;
}

/* ====== AKILLI EŞLEŞTİRME ====== */
function buildMatching(){
  const buyers=S.data.contacts.filter(x=>x.type==='buyer'&&x.status!=='closed');
  const props=S.data.properties.filter(x=>x.status!=='sold');
  const sellers=S.data.contacts.filter(x=>x.type==='seller');
  const matches=[];

  buyers.forEach(b=>{
    props.forEach(p=>{
      let score=0;let tags=[];
      if(b.district&&p.district&&b.district.trim().toLowerCase()===p.district.trim().toLowerCase()){score+=40;tags.push('📍 Semt');}
      if(b.propType&&p.propType&&b.propType===p.propType){score+=30;tags.push('🏠 Tür');}
      if(b.budget&&p.price){
        const bd=parseFloat(b.budget),pd=parseFloat(p.price);
        if(!isNaN(bd)&&!isNaN(pd)){
          if(pd>bd*1.15){score=-999;}
          else{score+=20;tags.push('💰 Bütçe');}
        }
      }
      if(b.rooms&&p.rooms&&b.rooms===p.rooms){score+=10;tags.push('🚪 Oda');}
      if(score>=50&&tags.length>=2)matches.push({buyer:b,prop:p,owner:sellers.find(x=>x.id===p.ownerId),score,tags});
    });
  });

  matches.sort((a,b)=>b.score-a.score);

  return `<div class="content">${buildHeader('Akıllı Eşleştirme',true)}
    <div style="padding:14px 16px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;padding:10px 12px;background:#f8fafc;border-radius:10px;border:1px solid var(--border)">
        Eşleşme için <b>semt + mülk türü</b> gibi en az 2 kriterin uyuşması ve bütçenin aşılmaması gerekir.
      </div>
      ${matches.length===0
        ?`<div class="empty"><div class="empty-icon">🔗</div><div class="empty-title">Eşleşme bulunamadı</div><div class="empty-sub">Alıcı ve mülk bilgilerini (semt, tür, bütçe) doldurduğunuzda eşleştirme yapılır.</div></div>`
        :matches.map(m=>{
          const color=m.score>=80?'var(--green)':m.score>=60?'var(--amber)':'var(--coral)';
          return `<div class="match-card">
            <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:10px">
              <div style="font-size:28px;font-weight:800;color:${color}">%${m.score}</div>
              <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${m.tags.map(t=>`<span class="badge" style="background:#f1f5f9;color:var(--muted)">${t}</span>`).join('')}</div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:10px">
              <div>
                <div style="font-size:12px;color:var(--muted);margin-bottom:2px">👤 Alıcı</div>
                <div style="font-weight:700;font-size:15px">${esc(m.buyer.name)}</div>
                <div style="font-size:13px;color:var(--muted)">${numFmt(m.buyer.budget)||'Bütçe yok'} · ${esc(m.buyer.district||'Semt yok')}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:12px;color:var(--muted);margin-bottom:2px">🏘️ Mülk</div>
                <div style="font-weight:700;font-size:15px">${esc(m.prop.title||m.prop.propType||'-')}</div>
                <div style="font-size:13px;color:var(--muted)">${numFmt(m.prop.price)||'-'}</div>
              </div>
            </div>
            ${m.owner?`<div style="font-size:13px;color:var(--muted);margin-bottom:10px">🏷️ Satıcı: ${esc(m.owner.name)}</div>`:''}
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              ${m.buyer.phone?`<button class="btn-small btn-small-green" style="display:flex;align-items:center;gap:4px;background:#EAF3DE;color:#3B6D11;border:none" onclick="waOpen('${fmtPhone(m.buyer.phone)}','Merhaba ${esc(m.buyer.name.split(' ')[0])}, aradığınız kriterlere %${m.score} uyan bir portföyümüz var. İncelemek ister misiniz?')">${WA_SVG} Alıcıya Öner</button>`:''}
              ${m.owner?.phone?`<button class="btn-small btn-small-green" style="display:flex;align-items:center;gap:4px;background:#EAF3DE;color:#3B6D11;border:none" onclick="waOpen('${fmtPhone(m.owner.phone)}','Merhaba ${esc(m.owner.name.split(' ')[0])}, mülkünüzle ilgilenen ciddi bir alıcımız var.')">${WA_SVG} Satıcıya Bildir</button>`:''}
            </div>
          </div>`;}).join('')}
    </div>
  </div>`;
}
